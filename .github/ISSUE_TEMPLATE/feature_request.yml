name: Feature request
description: An idea for something uofthub should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/uofthub/uofthub/blob/main/docs/ROADMAP.md) and [future.md](https://github.com/uofthub/uofthub/blob/main/docs/future.md) first — it may already be planned or under discussion.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you picture it working.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and who can see what
      description: Does this show anything about a student to someone new, or change who can see a project? Say how.
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself.
