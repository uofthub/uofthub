name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly, so a newly published advisory against an unchanged lockfile still
  # turns the build red.
  schedule:
    - cron: '0 12 * * 1'

# Read-only by default: nothing here writes to the repository, so a
# compromised step or dependency gets a token that cannot either.
permissions:
  contents: read

# Actions are pinned to commit SHAs, not tags: a tag can be moved to other
# code after review, a SHA cannot. Dependabot proposes the bumps.
jobs:
  check:
    runs-on: ubuntu-latest

    services:
      # The API tests run against a real Postgres, not a mock: the rules being
      # tested (visibility filtering above all) are Prisma queries, and a mock
      # would only prove the query builder was called.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uofthub
          POSTGRES_PASSWORD: uofthub
          POSTGRES_DB: uofthub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uofthub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://uofthub:uofthub@localhost:5432/uofthub_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Version comes from the root package.json's `packageManager` field, so
      # CI, the Docker image and a laptop all run the same pnpm.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Generated types, not checked in — typecheck and build both need them.
      - name: Generate Prisma client
        run: pnpm --filter @uofthub/api db:generate

      - run: pnpm typecheck

      - name: Test (API)
        run: pnpm --filter @uofthub/api test

      - name: Test (web)
        run: pnpm --filter @uofthub/web test

      - run: pnpm build

      - run: pnpm lint

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, so the secret scan covers every commit.
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Known vulnerabilities in what ships (not dev tooling) fail the build.
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high

      # The CLI from its official image, pinned: the gitleaks GitHub Action
      # needs a paid license on organization repositories.
      - name: Secret scan (full history)
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner
