name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      # The API tests run against a real Postgres, not a mock: the rules being
      # tested (visibility filtering above all) are Prisma queries, and a mock
      # would only prove the query builder was called.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: uofthub
          POSTGRES_PASSWORD: uofthub
          POSTGRES_DB: uofthub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uofthub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://uofthub:uofthub@localhost:5432/uofthub_test

    steps:
      - uses: actions/checkout@v4

      # Version comes from the root package.json's `packageManager` field, so
      # CI, the Docker image and a laptop all run the same pnpm.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Generated types, not checked in — typecheck and build both need them.
      - name: Generate Prisma client
        run: pnpm --filter @uofthub/api db:generate

      - run: pnpm typecheck

      - name: Test (API)
        run: pnpm --filter @uofthub/api test

      - name: Test (web)
        run: pnpm --filter @uofthub/web test

      - run: pnpm build

      - run: pnpm lint
