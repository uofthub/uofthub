name: Scheduled jobs

# The two maintenance scripts documented in docs/ARCHITECTURE.md § Scheduled
# jobs. They existed and were never scheduled anywhere, which meant expired
# unverified groups were never deleted and verified groups stopped receiving
# their per-term storage allowance.
#
# Running them here rather than as Railway cron jobs is a trade: this needs a
# database URL in a GitHub secret, where Railway cron would run inside the
# private network with the credentials it already has. If you move them to
# Railway, delete this file — two schedulers running the same sweep is not
# harmful (both are idempotent) but it is confusing.
#
# Requires a `DATABASE_URL` repository secret pointing at production. Without
# it the job reports skipped rather than failing every night.

on:
  schedule:
    # 07:00 UTC — around 02:00 or 03:00 in Toronto depending on DST, which is
    # when a deletion is least likely to surprise somebody mid-submission.
    - cron: '0 7 * * *'
  # So the sweep can be run by hand after a change, without waiting a day.
  workflow_dispatch:

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @uofthub/api db:generate

      - name: Check the database secret is configured
        id: guard
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set — skipping." >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Deletes groups still PENDING_VERIFICATION / INFO_REQUESTED past their
      # deadline. POST /orgs/:slug/verify independently refuses an expired
      # deadline, so a missed run delays cleanup rather than reopening a window.
      - name: Sweep expired unverified groups
        if: steps.guard.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @uofthub/api sweep-orgs

      # Grants each verified group the current term's storage allowance if it
      # has not had one yet. Idempotent, so a double run costs nothing.
      - name: Grant term storage allowances
        if: steps.guard.outputs.configured == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm --filter @uofthub/api grant-term-storage
