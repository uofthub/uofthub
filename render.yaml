# Render Blueprint for the API and its database. The web app is on Cloudflare
# Pages, not here — see docs/ARCHITECTURE.md § Deployment.
#
# Render → New → Blueprint → this repo. Variables marked `sync: false` are
# prompted for on the first sync and never stored in this file.

services:
  - type: web
    name: uofthub-api
    runtime: docker
    # Paid: a free instance spins down when idle, which drops the /events
    # streams and stops the in-process sweeps.
    plan: starter
    region: ohio
    branch: main
    # Repo root as context: the image needs packages/types and the lockfile.
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # Web-only and docs changes don't rebuild the API.
    buildFilter:
      paths:
        - api/**
        - packages/**
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - tsconfig.json
    # Must be a subdomain of WEB_URL's domain, or the session cookie is dropped.
    domains:
      - api.uofthub.com
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: uofthub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_URL
        value: https://uofthub.com
      - key: API_URL
        value: https://api.uofthub.com

      - key: STORAGE_BUCKET
        value: uofthub-prod-files
      - key: STORAGE_REGION
        value: auto
      # https://<ACCOUNT_ID>.r2.cloudflarestorage.com
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false

      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: uofthub <notifications@notifications.uofthub.com>

      # `npx web-push generate-vapid-keys`; unset disables push notifications.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:hello@uofthub.com

      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_TENANT_ID
        value: organizations
      - key: MICROSOFT_REDIRECT_URI
        value: https://api.uofthub.com/auth/callback
      # U of T's tenant id; see api/.env.example for how to find it.
      - key: MICROSOFT_ALLOWED_TENANT_IDS
        sync: false

      - key: OPENAI_API_KEY
        sync: false

      # The image scanner below. Its URL is https://<its onrender.com host>;
      # unset leaves uploads queued, unscanned, until it is set.
      - key: SCANNER_URL
        sync: false
      - key: SCANNER_TOKEN
        fromService:
          type: web
          name: uofthub-scanner
          envVarKey: SCANNER_TOKEN

  # NudeNet, checking uploaded images for nudity (scanner/, and
  # api/src/lib/imageScan.ts). Free: it sleeps when idle and the API's sweep
  # wakes it, so a scan can wait a minute or two. Reachable from the internet
  # (free instances get no private network), so every request needs the token.
  - type: web
    name: uofthub-scanner
    runtime: docker
    plan: free
    region: ohio
    branch: main
    dockerfilePath: ./scanner/Dockerfile
    dockerContext: ./scanner
    healthCheckPath: /health
    buildFilter:
      paths:
        - scanner/**
    envVars:
      - key: SCANNER_TOKEN
        generateValue: true

databases:
  - name: uofthub-db
    databaseName: uofthub
    user: uofthub
    plan: basic-256mb
    region: ohio
    postgresMajorVersion: '18'
    # Private network only: the API reaches it internally, nothing else should.
    ipAllowList: []
