<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Installable: on iPhone, push notifications only work for a site
         added to the home screen, which is what this manifest makes it. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <!-- Blocking on purpose: it sets the theme before first paint. A file of
         its own rather than inline, so the Content-Security-Policy in
         public/_headers can refuse every inline script. -->
    <script src="/theme.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- The site's defaults for search and link previews. The Pages Functions
         (functions/) rewrite these per page — a project's own title and card,
         the page's own canonical address — by setting attributes on these
         tags, so every one of them has to be here. -->
    <title>uofthub · Student projects at the University of Toronto</title>
    <meta
      name="description"
      content="Share and discover everything students build at the University of Toronto — apps, research, films, design, music and hardware."
    />
    <link rel="canonical" href="https://uofthub.com/" />
    <meta property="og:site_name" content="uofthub" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://uofthub.com/" />
    <meta property="og:title" content="uofthub" />
    <meta
      property="og:description"
      content="Share and discover everything students build at the University of Toronto — apps, research, films, design, music and hardware."
    />
    <meta property="og:image" content="https://uofthub.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="uofthub — everything students build at the University of Toronto"
    />
    <meta property="og:locale" content="en_CA" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="uofthub" />
    <meta
      name="twitter:description"
      content="Share and discover everything students build at the University of Toronto — apps, research, films, design, music and hardware."
    />
    <meta name="twitter:image" content="https://uofthub.com/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
