<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/uofthub-mark.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f0f0f" />
    <script>
      // Resolve the theme before first paint so light-mode users never see a
      // dark flash (and vice versa). Must match the defaults in lib/ui.tsx.
      ;(function () {
        try {
          var saved = localStorage.getItem('dark-mode')
          var dark = saved === null ? window.matchMedia('(prefers-color-scheme: dark)').matches : saved === 'true'
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document.querySelector('meta[name="theme-color"]').content = dark ? '#0f0f0f' : '#ffffff'
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Jost:wght@700&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="Publish and discover everything students build at the University of Toronto — projects, research, studio work and side projects."
    />
    <title>Projects, Research and Everything Students Build | uofthub</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
